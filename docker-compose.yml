name: signalhop
x-app-env: &app-env
  DATABASE_URL: postgresql://signalhop:${POSTGRES_PASSWORD:-signalhop_dev}@postgres:5432/signalhop
  REDIS_URL: redis://redis:6379
  API_PORT: 4000
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: signalhop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signalhop_dev}
      POSTGRES_DB: signalhop
    ports: ['127.0.0.1:${POSTGRES_PORT:-55432}:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/test.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U signalhop']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports: ['127.0.0.1:${REDIS_PORT:-56379}:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: { context: ., target: api }
    env_file: ${ENV_FILE:-.env}
    environment: *app-env
    command:
      [
        'node',
        'node_modules/typeorm/cli.js',
        'migration:run',
        '-d',
        'apps/api/dist/database/data-source.js',
      ]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  api:
    build: { context: ., target: api }
    env_file: ${ENV_FILE:-.env}
    environment: *app-env
    ports: ['127.0.0.1:${API_HOST_PORT:-4000}:4000']
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20
  worker:
    build: { context: ., target: worker }
    env_file: ${ENV_FILE:-.env}
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
  web:
    build: { context: ., target: web }
    environment:
      API_INTERNAL_URL: http://api:4000
    ports: ['127.0.0.1:${WEB_PORT:-3000}:3000']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20
volumes:
  postgres-data:
  redis-data:
